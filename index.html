            });

                const saved = localStorage.getItem('kindergarten_custom_words');
                return saved ? JSON.parse(saved) : [];

            const [activeTab, setActiveTab] = useState('practice');
            const [selectedCategory, setSelectedCategory] = useState('listen-type');

            const [streak, setStreak] = useState(0);

            const [currentWordIndex, setCurrentWordIndex] = useState(0);
            const [userInput, setUserInput] = useState('');
            const [feedback, setFeedback] = useState(null); 
            const [scrambledLetters, setScrambledLetters] = useState([]);
            const [selectedLetterIndices, setSelectedLetterIndices] = useState([]);
            const [missingCharIndex, setMissingCharIndex] = useState(0);
            const [scrambledSentenceWords, setScrambledSentenceWords] = useState([]);
            const [selectedSentenceWords, setSelectedSentenceWords] = useState([]);
            const [quizOptions, setQuizOptions] = useState([]);
            const [activeSentenceIndex, setActiveSentenceIndex] = useState(0);
            
            const [searchQuery, setSearchQuery] = useState('');
            const [shuffledIndices, setShuffledIndices] = useState([]);

            const [parentUnlocked, setParentUnlocked] = useState(false);
            const [pinInput, setPinInput] = useState('');
            const [newWordInput, setNewWordInput] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [parentMessage, setParentMessage] = useState('');

            useEffect(() => {
                localStorage.setItem('kindergarten_spelling_words', JSON.stringify(words));
            }, [words]);

            useEffect(() => {
                localStorage.setItem('kindergarten_custom_words', JSON.stringify(customWords));
            }, [customWords]);

            const currentWordList = useCustomOnly 
                ? (customWords.length > 0 ? customWords : [{ id: 'empty', word: 'star', definition: 'A bright point in night sky', sentences: ['Look at the bright star.', 'A star shines at night.'] }])
                : words;

            useEffect(() => {
                if (!currentWordList || currentWordList.length === 0) return;
                const indices = Array.from({ length: currentWordList.length }, (_, i) => i);
                for (let i = indices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [indices[i], indices[j]] = [indices[j], indices[i]];
                }
                setShuffledIndices(indices);
                setCurrentWordIndex(0);
            }, [useCustomOnly, words.length, customWords.length]);

            const activeWordPointer = shuffledIndices[currentWordIndex % (shuffledIndices.length || 1)] || 0;
            const currentWordObj = currentWordList[activeWordPointer] || currentWordList[0];

            const speakText = (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.rate = 0.85;
                    utterance.pitch = 1.1;
                    window.speechSynthesis.speak(utterance);
                }
            };

            useEffect(() => {
                if (!currentWordObj) return;

                setFeedback(null);
                setUserInput('');
                setSelectedLetterIndices([]);
                setSelectedSentenceWords([]);

                const wordStr = currentWordObj.word.toLowerCase();

                if (selectedCategory === 'scramble') {
                    const arr = wordStr.split('');
                    let shuffled = [...arr];
                    if (arr.length > 1) {
                        let attempts = 0;
                        while (attempts < 5) {
                            for (let i = shuffled.length - 1; i > 0; i--) {
                                const j = Math.floor(Math.random() * (i + 1));
                                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                            }
                            if (shuffled.join('') !== wordStr) break;
                            attempts++;
                        }
                    }
                    setScrambledLetters(shuffled);
                }

                if (selectedCategory === 'missing-letter') {
                    const randomCharIdx = Math.floor(Math.random() * wordStr.length);
                    setMissingCharIndex(randomCharIdx);
                }

                if (selectedCategory === 'sentence-builder') {
                    const sentencesCount = currentWordObj.sentences?.length || 1;
                    const randSentenceIdx = Math.floor(Math.random() * sentencesCount);
                    setActiveSentenceIndex(randSentenceIdx);

                    const targetSentence = currentWordObj.sentences?.[randSentenceIdx] || `${currentWordObj.word} is a great word.`;
                    const cleanWords = targetSentence.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").split(' ');
                    
                    const shuffledWords = [...cleanWords];
                    for (let i = shuffledWords.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [shuffledWords[i], shuffledWords[j]] = [shuffledWords[j], shuffledWords[i]];
                    }
                    setScrambledSentenceWords(shuffledWords);
                }

                if (selectedCategory === 'quiz') {
                    const distractors = currentWordList
                        .filter(w => w.word.toLowerCase() !== wordStr)
                        .map(w => w.word);
                    
                    let choices = [currentWordObj.word];
                    while (choices.length < 4 && distractors.length > 0) {
                        const randIdx = Math.floor(Math.random() * distractors.length);
                        const picked = distractors.splice(randIdx, 1)[0];
                        if (!choices.includes(picked)) choices.push(picked);
                    }
                    while (choices.length < 4) {
                        choices.push(currentWordObj.word + (choices.length % 2 === 0 ? 's' : 'ing'));
                    }
                    for (let i = choices.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [choices[i], choices[j]] = [choices[j], choices[i]];
                    }
                    setQuizOptions(choices);
                }
            }, [currentWordIndex, selectedCategory, useCustomOnly, shuffledIndices]);

            const handleNextWord = () => {
                setCurrentWordIndex((prev) => (prev + 1) % (shuffledIndices.length || 1));
                setActiveSentenceIndex((prev) => (prev + 1) % 2);
            };

            const handlePrevWord = () => {
                setCurrentWordIndex((prev) => (prev - 1 + (shuffledIndices.length || 1)) % (shuffledIndices.length || 1));
            };

            const triggerReward = () => {
                setScore(prev => prev + 10);
                setStreak(prev => prev + 1);
                setStars(prev => prev + 1);
                setFeedback({ type: 'success', message: '🎉 Super Job! That is Correct!' });
                speakText("Great job! That is correct!");
            };

            const checkListenType = (e) => {
                e.preventDefault();
                if (userInput.trim().toLowerCase() === currentWordObj.word.toLowerCase()) {
                    triggerReward();
                } else {
                    setFeedback({ type: 'error', message: 'Try again! Listen carefully.' });
                    speakText("Try again!");
                    setStreak(0);
                }
            };

            const handleScrambleTileClick = (index, char) => {
                if (selectedLetterIndices.includes(index)) {
                    setSelectedLetterIndices(selectedLetterIndices.filter(i => i !== index));
                } else {
                    const newIndices = [...selectedLetterIndices, index];
                    setSelectedLetterIndices(newIndices);

                    const constructedWord = newIndices.map(i => scrambledLetters[i]).join('');
                    if (constructedWord.length === currentWordObj.word.length) {
                        if (constructedWord.toLowerCase() === currentWordObj.word.toLowerCase()) {
                            triggerReward();
                        } else {
                            setFeedback({ type: 'error', message: 'Not quite! Try another order.' });
                            speakText("Not quite! Try again.");
                            setStreak(0);
                        }
                    }
                }
            };

            const handleMissingLetterInput = (char) => {
                const correctChar = currentWordObj.word[missingCharIndex].toLowerCase();
                if (char.toLowerCase() === correctChar) {
                    setUserInput(char);
                    triggerReward();
                } else {
                    setFeedback({ type: 'error', message: `Oops! That's not the right letter.` });
                    speakText("Oops! Try another letter.");
                    setStreak(0);

                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userQuery }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            generationConfig: {
                                responseMimeType: "application/json",
                                responseSchema: {
                                    type: "ARRAY",
                                    items: { type: "STRING" }
                                }
                            }

                        definition: `Parent assigned word: ${word}`,
                        sentences: sentences

                                            </button>

                                            <div className="flex justify-center items-center space-x-1.5">
                                                {currentWordObj.word.split('').map((char, idx) => {
                                                    if (idx === missingCharIndex) {
                                                        return (
                                                            <div
                                                                key={idx}
                                                                className="w-10 h-12 bg-amber-100 border-b-4 border-amber-500 rounded-lg flex items-center justify-center font-black text-xl text-amber-800 animate-pulse"
                                                            >
                                                                {userInput ? userInput.toUpperCase() : '?'}
                                                            </div>
                                                        );
                                                    }
                                                    return (
                                                        <div
                                                            key={idx}
                                                            className="w-10 h-12 bg-slate-100 rounded-lg flex items-center justify-center font-black text-xl text-slate-700 border border-slate-200"
                                                        >
                                                            {char.toUpperCase()}
                                                        </div>
                                                    );
                                                })}
                                            </div>

                                            <div className="pt-1">
                                                <div className="flex flex-wrap justify-center gap-1 max-w-xs mx-auto">
                                                    {"abcdefghijklmnopqrstuvwxyz".split('').map((letter) => (
                                                        <button
                                                            key={letter}
                                                            onClick={() => handleMissingLetterInput(letter)}
                                                            className="w-7 h-7 text-xs font-bold bg-white text-slate-700 rounded-md border border-slate-200 hover:bg-emerald-500 hover:text-white transition shadow-xs"
                                                        >
                                                            {letter.toUpperCase()}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {selectedCategory === 'sentence-builder' && (
                                        <div className="w-full text-center space-y-2.5 my-auto">
                                            <div className="bg-indigo-50/80 p-2 rounded-xl border border-indigo-100 flex items-center justify-between max-w-md mx-auto">
                                                <span className="text-xs font-bold text-indigo-900 truncate">Target: <strong className="capitalize">{currentWordObj.word}</strong></span>
                                                <button
                                                    onClick={() => speakText(currentWordObj.sentences?.[activeSentenceIndex] || currentWordObj.word)}
                                                    className="p-1 bg-indigo-600 text-white rounded-md"
                                                >
                                                    <Volume2 className="w-3.5 h-3.5" />
                                                </button>
                                            </div>

                                            <div className="min-h-14 bg-slate-50 rounded-xl border-2 border-dashed border-slate-200 p-2 flex flex-wrap items-center justify-center gap-1.5 max-w-lg mx-auto">
                                                {selectedSentenceWords.length === 0 ? (
                                                    <span className="text-xs text-slate-400 font-bold">Tap words to rebuild the sentence</span>
                                                ) : (
                                                    selectedSentenceWords.map((item, idx) => (
                                                        <span
                                                            key={idx}
                                                            className="px-2.5 py-1 bg-indigo-600 text-white font-bold text-xs rounded-lg shadow-xs"
                                                        >
                                                            {item.word}
                                                        </span>
                                                    ))
                                                )}
                                            </div>

                                            <div className="flex flex-wrap justify-center gap-1.5 max-w-lg mx-auto">
                                                {scrambledSentenceWords.map((word, idx) => {
                                                    const isUsed = selectedSentenceWords.some(item => item.index === idx);
                                                    return (
                                                        <button
                                                            key={idx}
                                                            disabled={isUsed}
                                                            onClick={() => handleSentenceWordClick(word, idx)}
                                                            className={`px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-xs ${
                                                                isUsed
                                                                    ? 'bg-slate-200 text-slate-400 cursor-not-allowed'
                                                                    : 'bg-white text-slate-800 border-2 border-indigo-100 hover:border-indigo-400'
                                                            }`}
                                                        >
                                                            {word}
                                                        </button>
                                                    );
                                                })}
                                            </div>

                                            <button
                                                onClick={() => setSelectedSentenceWords([])}
                                                className="text-[11px] font-extrabold text-slate-400 hover:text-slate-600 flex items-center justify-center mx-auto space-x-1"
                                            >
                                                <RotateCcw className="w-3 h-3" />
                                                <span>Clear</span>
                                            </button>
                                        </div>
                                    )}

                                    {selectedCategory === 'quiz' && (
                                        <div className="w-full max-w-md text-center space-y-3 my-auto">
                                            <div className="bg-amber-50 p-2.5 rounded-xl border border-amber-100">
                                                <span className="text-[10px] font-black text-amber-700 uppercase tracking-wider block">Select correct spelling</span>
                                                <p className="text-xs font-bold text-slate-800 mt-0.5">"{currentWordObj.definition}"</p>
                                            </div>

                                            <div className="grid grid-cols-2 gap-2">
                                                {quizOptions.map((option, idx) => (
                                                    <button
                                                        key={idx}
                                                        onClick={() => handleQuizAnswer(option)}
                                                        className="py-3 px-2 bg-white hover:bg-amber-400 hover:text-white border-2 border-slate-200 hover:border-amber-400 text-slate-800 font-black text-sm rounded-xl transition shadow-xs transform active:scale-95 capitalize"
                                                    >
                                                        {option}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {feedback && (
                                    <div
                                        className={`flex-none p-2.5 rounded-xl flex items-center justify-between text-xs font-bold shadow-xs ${
                                            feedback.type === 'success'
                                                ? 'bg-emerald-500 text-white'
                                                : 'bg-rose-500 text-white'
                                        }`}
                                    >
                                        <div className="flex items-center space-x-1.5">
                                            {feedback.type === 'success' ? (
                                                <CheckCircle2 className="w-4 h-4 flex-shrink-0" />
                                            ) : (
                                                <XCircle className="w-4 h-4 flex-shrink-0" />
                                            )}
                                            <span>{feedback.message}</span>
                                        </div>
                                        {feedback.type === 'success' && (
                                            <button
                                                onClick={handleNextWord}
                                                className="px-2.5 py-1 bg-white text-emerald-700 rounded-lg text-xs font-black hover:bg-emerald-50 shadow-xs"
                                            >
                                                Next →
                                            </button>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
